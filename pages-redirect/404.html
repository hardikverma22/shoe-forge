<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shoe Forge has moved</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://shoe-forge.vercel.app/" />
    <meta http-equiv="refresh" content="0; url=https://shoe-forge.vercel.app/" />
    <script>
      // Keep the path, query and hash: /shoe-forge/studio/forge-runner?d=… → /studio/forge-runner?d=…
      (function () {
        var path = location.pathname.replace(/^\/shoe-forge/, "") || "/";
        location.replace("https://shoe-forge.vercel.app" + path + location.search + location.hash);
      })();
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e6e7ea; color: #0a0a12; font: 16px/1.5 system-ui, sans-serif; }
      a { color: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <p>Shoe Forge has moved to <a href="https://shoe-forge.vercel.app/">shoe-forge.vercel.app</a>.</p>
  </body>
</html>
